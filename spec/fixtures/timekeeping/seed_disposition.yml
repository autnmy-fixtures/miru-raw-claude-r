# Seed disposition for the Timekeeping pre-flight
# (docs/architecture/timekeeping-soa.md §10.4, §14 "Foundation, per lane").
#
# Recorded from the actual seeded data, not written by hand: db/seeds.rb run in
# the miru-test container on main at 4fe942d, with the default
# MIRU_SEED_AS_OF of 2026-10-23. Each invoice's referenced entries were read
# straight from invoice_line_items and invoice_line_item_time_entries.
#
# What the seed produced (3,088 entries, 57 invoices, none discarded):
#
# - orphans: none. Every locked entry is on a kept invoice.
# - conflicts: none. No entry is on two kept invoices.
# - retained and released (F2): none. The seed discards no invoice.
# - locked: 114 entries, exactly those on the three drafts FL-0054, FL-0055
#   and FL-0056. They map to active reservations with the edit lock, and are
#   not listed.
# - unlocked links: every other invoice. The seed writes these invoices with a
#   non-draft status from the start (paid, viewed, overdue or sent), so no draft
#   save ever locked their entries (L1). All of their entries are unlocked.
#
# Disposition of the unlocked links: each entry maps to a committed, active
# reservation with no edit lock, as §7.4 says for an entry on exactly one kept
# invoice. This keeps today's behaviour: the entry stays off candidate
# selection (it is on a kept invoice), and the seed marked it billed, so A3
# already refuses edits for every role. No value changes.
#
# Entry ids are not recorded: they follow the database sequences, which differ
# between runs. Invoice numbers are fixed by the seed.
